<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>TANY DESKTOP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>TANY DESKTOP</h1>
        <button id="new-routine-btn" class="primary">+ שגרה חדשה</button>
      </div>
      <ul id="routine-list"></ul>
      <div id="device-panel">
        <div id="device-name-row" style="display:flex; align-items:center; gap:6px">
          <div id="device-name">—</div>
          <button id="rename-device-btn" title="שינוי שם המחשב">✏️</button>
        </div>
        <div id="device-id" class="muted"></div>
        <div id="api-key-row">
          <button id="show-api-key-btn">הצג API Key</button>
          <button id="copy-api-key-btn" style="display:none">העתק</button>
        </div>
        <div id="api-key-value" class="muted" style="display:none"></div>
        <div id="service-row">
          <span id="service-status" class="badge">לא פעיל</span>
          <button id="service-toggle-btn">הפעל שירות</button>
        </div>
      </div>
    </aside>
    <main id="content">
      <div id="empty-state" class="panel">
        <p>בחרו שגרה מהרשימה, או צרו שגרה חדשה.</p>
      </div>
    </main>
  </div>

  <template id="tpl-routine-detail">
    <div class="panel">
      <div class="panel-header">
        <h2 class="r-name"></h2>
        <div class="actions">
          <button class="run-btn primary">הרץ עכשיו</button>
          <button class="rerecord-btn">הקלטה מחדש</button>
          <button class="delete-btn danger">מחק</button>
        </div>
      </div>
      <section>
        <h3>ניסוחי הפעלה (triggers)</h3>
        <div class="triggers"></div>
      </section>
      <section>
        <h3>שדות פלט</h3>
        <div class="outputs"></div>
      </section>
      <section>
        <h3>התחברות שמורה</h3>
        <div class="auth-status"></div>
        <button class="refresh-login-btn">רענון התחברות</button>
        <div class="login-active-controls" style="display:none">
          <button class="login-finish-btn primary">✅ סיימתי להתחבר - שמור</button>
          <button class="login-cancel-btn">❌ בטל</button>
        </div>
        <p class="hint">לשגרות באתרים שדורשים כניסה דרך Google/Microsoft וכד' - אם ההרצה מתחילה להיכשל בגלל שהחיבור פג, לוחצים כאן, מתחברים ידנית בחלון Chrome שנפתח, ואז לוחצים "סיימתי להתחבר".</p>
      </section>
      <section>
        <h3>רצף פעולות מוקלט</h3>
        <ol class="steps"></ol>
      </section>
      <section class="run-result-section" style="display:none">
        <h3>תוצאת הרצה</h3>
        <div class="run-result"></div>
        <div class="otp-form" style="display:none">
          <input type="text" class="otp-input" placeholder="קוד אימות (OTP)" />
          <button class="otp-submit primary">שלח קוד</button>
        </div>
      </section>
      <section>
        <h3>היסטוריית הרצות</h3>
        <table class="runlog-table">
          <thead><tr><th>מתי</th><th>סטטוס</th><th>שלב כשל</th><th>סיבה</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </template>

  <template id="tpl-new-routine">
    <div class="panel">
      <h2>שגרה חדשה</h2>
      <section>
        <label>סוג שגרה</label>
        <select class="new-type">
          <option value="web">אתר (דפדפן)</option>
          <option value="desktop">תוכנת דסקטופ (UI Automation)</option>
        </select>
      </section>
      <section class="web-only">
        <label>כתובת התחלה (URL)</label>
        <input type="text" class="new-start-url" placeholder="https://example.com" />

        <button class="login-btn">🔐 התחברות חד-פעמית (מומלץ אם נדרש Google/Microsoft Login)</button>
        <p class="hint">אם האתר דורש התחברות דרך גוגל/מיקרוסופט וכד' - מומלץ ללחוץ כאן קודם. ייפתח חלון Chrome רגיל (לא אוטומטי) - מתחברים בו ידנית, ואז לוחצים "סיימתי להתחבר". גוגל חוסם התחברות אוטומטית, אז השלב הזה מבוצע פעם אחת ונשמר לשימוש חוזר בהקלטה ובהרצות עתידיות.</p>
        <div class="login-active-controls" style="display:none">
          <button class="login-finish-btn primary">✅ סיימתי להתחבר - שמור</button>
          <button class="login-cancel-btn">❌ בטל</button>
        </div>
        <p class="login-status muted"></p>

        <button class="start-recording-btn primary">התחל הקלטה</button>
        <p class="hint">ייפתח דפדפן עם Playwright Inspector. בצעו את התהליך, ואז סגרו את חלון ההקלטה.</p>
        <p class="recording-status muted"></p>
      </section>
      <section class="desktop-only" style="display:none">
        <label>נתיב קובץ הפעלה (.exe)</label>
        <div style="display:flex; gap:6px">
          <input type="text" class="new-exe-path" placeholder="C:\Program Files\...\app.exe" style="flex:1" />
          <button class="pick-exe-btn">בחר קובץ...</button>
        </div>
        <p class="hint">התוכנה תיפתח אוטומטית עם תחילת ההקלטה. בצעו את התהליך בחלון שנפתח, ואז לחצו "סיימתי - עצור הקלטה" בחלון הקטן שיופיע. מבוסס Windows UI Automation - ראו <code>packages/engine-desktop/README.md</code> לגבי מגבלות ידועות.</p>

        <button class="start-recording-desktop-btn primary">התחל הקלטה</button>
        <p class="recording-status-desktop muted"></p>
      </section>

      <section class="steps-review" style="display:none">
        <h3>שלבים שהוקלטו</h3>
        <p class="hint">לכל שלב "מילוי" ניתן לסמן אם מדובר בסוד (סיסמה) או בשלב הזרקת OTP.</p>
        <ol class="new-steps"></ol>
        <button class="add-extract-btn">+ הוסף שלב חילוץ נתונים</button>

        <label>שם השגרה</label>
        <input type="text" class="new-name" placeholder='למשל: בדיקת מצב עו"ש' />

        <label>ניסוחי הפעלה (מופרדים בפסיק)</label>
        <input type="text" class="new-triggers" placeholder='מה מצב העו"ש, כמה כסף יש לי' />

        <button class="save-routine-btn primary">שמור שגרה</button>
      </section>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
